<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>北化二课活动</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./home.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('wah_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="home">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-link" href="./" title="北化二课活动">
        <div class="brand-logo">汇</div>
        <span class="brand-name" id="siteTitle">北化二课活动</span>
      </a>

      <label class="search-mini" for="searchInput">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜活动 / 公众号…" autocomplete="off" />
      </label>

      <div class="topbar-actions">
        <button class="profile-btn" id="profileBtn" type="button" title="设置我的学院、年级与校区，一键筛选能报名的活动">
          <span class="profile-dot" id="profileDot"></span>
          <span id="profileBtnText">👤 我的身份</span>
        </button>
        <button class="icon-btn view-mode-btn" id="viewModeBtn" type="button" title="切换 3D 翻书架 / 卡片网格视图" aria-label="切换视图模式"></button>
        <span class="fresh-dot-pill" id="livePill" title="数据更新状态">
          <span class="live-dot"></span>
          <span id="liveStatusText">同步中</span>
        </span>
        <button class="icon-btn" id="themeToggle" type="button" title="深浅主题" aria-label="切换主题"></button>
        <button class="icon-btn" id="refreshBtn" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="container filter-inner">
      <div class="chip-row" id="tagBar"></div>
      <div class="filter-right">
        <label class="toggle-ended toggle-eligible" title="仅保留全校可报及符合你所设身份的活动（未写明人群的活动默认保留）">
          <input type="checkbox" id="onlyEligibleCheck" />
          <span>只看我能报</span>
        </label>
        <label class="toggle-ended" title="隐藏报名已截止或活动已结束的条目">
          <input type="checkbox" id="hideEndedCheck" />
          <span>隐藏已结束</span>
        </label>
        <div class="select-wrap">
          <select id="audienceFilter" aria-label="按面向人群筛选">
            <option value="">全部人群</option>
            <option value="all">全校可报</option>
            <option value="undergrad">本科生可报</option>
            <option value="freshman">大一新生</option>
            <option value="grad">研究生</option>
            <option value="college">限指定学院</option>
            <option value="club">社团内部</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sortSelect" aria-label="排序方式">
            <option value="smart">智能排序</option>
            <option value="latest">最新发布</option>
            <option value="deadline">最快截止</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sourceFilter" aria-label="按来源公众号筛选">
            <option value="">全部公众号</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <main class="container main-area">
    <div id="cacheBanner" class="cache-banner hidden" role="status">
      <div id="cacheBannerText"></div>
      <button class="btn btn-sm" id="retryOnlineBtn" type="button">重新同步</button>
    </div>

    <div id="reminderToast" class="reminder-toast hidden" role="alert"></div>

    <!-- Wenku8 风格 3D 翻书架卡片视图（手机默认开启，电脑可一键切换） -->
    <section id="shelfSection" class="shelf-section hidden" aria-label="活动翻书架视图">
      <div class="shelf-bank">
        <div class="shelf-stage" id="shelfStage" tabindex="0" role="region" aria-label="左右滑动翻动活动书架">
          <div class="shelf-pool" id="shelfPool"></div>
        </div>
        <div class="shelf-pager" id="shelfPager">
          <span class="shelf-hint">← 左右轻滑翻书 · 点选侧边居中 · 点中心开推文 →</span>
          <div class="shelf-pager-controls">
            <button type="button" class="shelf-step-btn" id="shelfPrevBtn" aria-label="上一份活动">‹</button>
            <span class="shelf-counter" id="shelfCounter">01 / 01</span>
            <button type="button" class="shelf-step-btn" id="shelfNextBtn" aria-label="下一份活动">›</button>
          </div>
        </div>
        <div id="shelfActiveCard" class="shelf-active-card"></div>
      </div>
    </section>

    <section id="activitiesGrid" class="cards-grid" aria-live="polite">
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
    </section>
  </main>

  <footer class="mini-footer">
    <div class="container mini-footer-inner">
      <span id="lastUpdateText"></span>
      <a href="/admin" class="admin-quiet-link">管理</a>
    </div>
  </footer>

  <!-- 静音报名提醒弹窗 -->
  <div id="remindModal" class="rm-backdrop hidden">
    <div class="rm-dialog" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
      <div class="rm-head">
        <h3 id="rmTitle">静音报名提醒（不响铃）</h3>
        <button type="button" id="rmClose" class="icon-btn" style="width:30px;height:30px;">✕</button>
      </div>
      <div id="rmActName" class="rm-act-name"></div>
      <div class="rm-note">仅通过<strong>简短消息 + 轻微振动</strong>提醒，绝不响铃，上课时可安心使用。</div>

      <div id="rmQuickWrap" class="rm-quick-group"></div>

      <div class="rm-field">
        <label for="rmCustomTime">自定义提醒时间</label>
        <input type="datetime-local" id="rmCustomTime" class="input" />
      </div>

      <div class="rm-actions">
        <button type="button" id="rmIcsBtn" class="btn btn-sm" title="写入手机系统日历（无声弹窗，关网页/锁屏也准时生效）">📅 导入手机日历(关网页也生效)</button>
        <button type="button" id="rmCancelExisting" class="btn btn-sm btn-danger hidden">取消提醒</button>
        <button type="button" id="rmSaveBtn" class="btn btn-sm btn-primary">开启静音振动提醒</button>
      </div>
    </div>
  </div>

  <!-- 我的身份设置弹窗 -->
  <div id="profileModal" class="rm-backdrop hidden">
    <div class="rm-dialog" role="dialog" aria-modal="true" aria-labelledby="profTitle">
      <div class="rm-head">
        <h3 id="profTitle">👤 设置我的北化身份</h3>
        <button type="button" id="profClose" class="icon-btn" style="width:30px;height:30px;">✕</button>
      </div>
      <div class="rm-note">仅保存在你的本机浏览器中。设置后开启<strong>「只看我能报」</strong>即可自动屏蔽其他学院、社团内部或非本年级活动（未写明人群的活动默认保留不误杀）。</div>

      <div class="rm-field">
        <label for="profDegreeGrade">学历与年级</label>
        <select id="profDegreeGrade" class="input">
          <option value="">暂不指定</option>
          <option value="freshman">本科生 · 大一新生</option>
          <option value="upper">本科生 · 非大一（大二~大四）</option>
          <option value="grad">研究生（硕士 / 博士）</option>
        </select>
      </div>

      <div class="rm-field">
        <label for="profCollege">所在学院 / 书院</label>
        <select id="profCollege" class="input">
          <option value="">暂不指定</option>
          <option value="化学学院">化学学院</option>
          <option value="化工学院">化工学院</option>
          <option value="材料学院">材料学院</option>
          <option value="机电学院">机电学院</option>
          <option value="信息学院">信息学院</option>
          <option value="经管学院">经管学院</option>
          <option value="数理学院">数理学院</option>
          <option value="文法学院">文法学院</option>
          <option value="生命学院">生命学院</option>
          <option value="巴黎居里学院">巴黎居里学院</option>
          <option value="国际教育学院">国际教育学院</option>
          <option value="宏德书院">宏德书院</option>
          <option value="侯德榜工程师学院">侯德榜工程师学院</option>
          <option value="艺术与设计系">艺术与设计系</option>
        </select>
      </div>

      <div class="rm-field">
        <label for="profCampus">所在校区</label>
        <select id="profCampus" class="input">
          <option value="">暂不指定</option>
          <option value="changping">昌平校区（北区）</option>
          <option value="chaoyang">朝阳校区（东区）</option>
          <option value="haidian">海淀校区（西区）</option>
        </select>
      </div>

      <div class="rm-field">
        <label>政治面貌与社团偏好（选填）</label>
        <div class="prof-checks">
          <label><input type="checkbox" id="profLeague" /> 共青团员</label>
          <label><input type="checkbox" id="profParty" /> 中共党员 / 预备 / 积极分子</label>
          <label><input type="checkbox" id="profShowClub" /> 仍显示「限社团内部」招募</label>
        </div>
      </div>

      <div class="rm-actions">
        <button type="button" id="profResetBtn" class="btn btn-sm">清空身份</button>
        <button type="button" id="profSaveBtn" class="btn btn-sm btn-primary">保存并开启筛选</button>
      </div>
    </div>
  </div>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script src="./app.js"></script>
</body>
</html>
