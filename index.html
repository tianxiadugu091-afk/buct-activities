<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>北化二课活动</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./home.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('wah_theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body class="home">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-link" href="./" title="北化二课活动">
        <div class="brand-logo">汇</div>
        <span class="brand-name" id="siteTitle">北化二课活动</span>
      </a>

      <label class="search-mini" for="searchInput">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜活动 / 公众号…" autocomplete="off" />
      </label>

      <div class="topbar-actions">
        <span class="fresh-dot-pill" id="livePill" title="数据更新状态">
          <span class="live-dot"></span>
          <span id="liveStatusText">同步中</span>
        </span>
        <button class="icon-btn" id="viewModeBtn" type="button" title="切换双列卡片 / 沉浸翻卡" aria-label="切换视图模式"></button>
        <button class="icon-btn" id="themeToggle" type="button" title="深浅主题" aria-label="切换主题"></button>
        <button class="icon-btn" id="refreshBtn" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="container filter-inner">
      <div class="chip-row" id="tagBar"></div>
      <button type="button" class="mobile-filter-btn" id="mobileFilterBtn" aria-label="展开筛选与排序" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg>
        <span>筛选</span>
        <span class="mf-badge hidden" id="mobileFilterBadge">0</span>
      </button>
      <div class="filter-right">
        <label class="toggle-ended" title="隐藏报名已截止或活动已结束的条目">
          <input type="checkbox" id="hideEndedCheck" />
          <span>隐藏已结束</span>
        </label>
        <div class="select-wrap">
          <select id="audienceFilter" aria-label="按面向人群筛选">
            <option value="">全部人群</option>
            <option value="all">全校可报</option>
            <option value="undergrad">本科生可报</option>
            <option value="freshman">大一新生</option>
            <option value="grad">研究生</option>
            <option value="college">限指定学院</option>
            <option value="club">社团内部</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sortSelect" aria-label="排序方式">
            <option value="smart">智能排序</option>
            <option value="latest">最新发布</option>
            <option value="deadline">最快截止</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sourceFilter" aria-label="按来源公众号筛选">
            <option value="">全部公众号</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <main class="container main-area">
    <div id="cacheBanner" class="cache-banner hidden" role="status">
      <div id="cacheBannerText"></div>
      <button class="btn btn-sm" id="retryOnlineBtn" type="button">重新同步</button>
    </div>

    <div id="reminderToast" class="reminder-toast hidden" role="alert"></div>

    <!-- 急抢雷达横带（仅在有即将开抢/临近截止活动时自动显示） -->
    <div id="radarWrap" class="radar-wrap hidden" aria-label="急抢雷达">
      <div class="radar-badge">
        <span class="radar-pulse"></span>
        <span>急抢雷达</span>
      </div>
      <div class="radar-track" id="radarTrack"></div>
    </div>

    <section id="activitiesGrid" class="cards-grid" aria-live="polite">
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
      <div class="sk-card"><div class="sk sk-tag"></div><div class="sk sk-title"></div><div class="sk sk-box"></div></div>
    </section>

    <!-- 沉浸横滑翻卡舞台（原生 scroll-snap 60fps） -->
    <section id="deckStage" class="deck-stage hidden" aria-live="polite">
      <div class="deck-track" id="deckTrack"></div>
      <div class="deck-pager" id="deckPager">
        <button type="button" class="deck-nav-btn" id="deckPrevBtn" aria-label="上一张">‹</button>
        <div class="deck-progress-wrap">
          <div class="deck-progress-bar"><div class="deck-progress-fill" id="deckProgressFill"></div></div>
          <span class="deck-counter" id="deckCounter">01 / 01</span>
        </div>
        <button type="button" class="deck-nav-btn" id="deckNextBtn" aria-label="下一张">›</button>
      </div>
    </section>
  </main>

  <!-- 悬浮待抢收藏夹胶囊 -->
  <div id="favDock" class="fav-dock hidden" role="region" aria-label="待抢收藏夹">
    <button type="button" class="fav-dock-btn" id="favDockToggle">
      <span class="fav-dock-star">★</span>
      <span id="favDockText">待抢清单</span>
      <span class="fav-dock-count" id="favDockCount">0</span>
    </button>
    <button type="button" class="fav-dock-clear hidden" id="favDockAllBtn">看全部</button>
  </div>

  <footer class="mini-footer">
    <div class="container mini-footer-inner">
      <span id="lastUpdateText"></span>
      <a href="/admin" class="admin-quiet-link">管理</a>
    </div>
  </footer>

  <!-- 移动端底部筛选抽屉（方案 C） -->
  <div id="filterSheet" class="sheet-backdrop" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="fsTitle">
      <div class="sheet-handle-area" data-sheet-close="filterSheet"><span class="sheet-handle"></span></div>
      <div class="sheet-head">
        <h3 id="fsTitle">筛选与排序</h3>
        <button type="button" class="icon-btn sheet-close-btn" data-sheet-close="filterSheet" aria-label="关闭筛选">✕</button>
      </div>
      <div class="sheet-body">
        <div class="fs-section">
          <div class="fs-label">排序方式</div>
          <div class="fs-pills" id="fsSortPills">
            <button type="button" class="fs-pill" data-sort="smart">智能排序</button>
            <button type="button" class="fs-pill" data-sort="latest">最新发布</button>
            <button type="button" class="fs-pill" data-sort="deadline">最快截止</button>
          </div>
        </div>

        <div class="fs-section">
          <div class="fs-label">面向人群</div>
          <div class="fs-pills" id="fsAudiencePills">
            <button type="button" class="fs-pill" data-audience="">全部人群</button>
            <button type="button" class="fs-pill" data-audience="all">全校可报</button>
            <button type="button" class="fs-pill" data-audience="undergrad">本科生可报</button>
            <button type="button" class="fs-pill" data-audience="freshman">大一新生</button>
            <button type="button" class="fs-pill" data-audience="grad">研究生</button>
            <button type="button" class="fs-pill" data-audience="college">限指定学院</button>
            <button type="button" class="fs-pill" data-audience="club">社团内部</button>
          </div>
        </div>

        <div class="fs-section">
          <div class="fs-label">来源公众号</div>
          <div class="select-wrap fs-select-wrap">
            <select id="fsSourceSelect" aria-label="按来源公众号筛选">
              <option value="">全部公众号</option>
            </select>
          </div>
        </div>

        <label class="fs-switch-row" for="fsHideEndedCheck">
          <div>
            <div class="fs-switch-title">隐藏已结束活动</div>
            <div class="fs-switch-sub">过滤掉报名已截止或活动已结束的条目</div>
          </div>
          <input type="checkbox" id="fsHideEndedCheck" class="fs-checkbox" />
        </label>
      </div>
      <div class="sheet-foot">
        <button type="button" class="sheet-btn sheet-btn-ghost" id="fsResetBtn">重置</button>
        <button type="button" class="sheet-btn sheet-btn-primary" id="fsDoneBtn">查看结果</button>
      </div>
    </div>
  </div>

  <!-- 活动详情半屏抽屉（方案 A） -->
  <div id="detailSheet" class="sheet-backdrop" aria-hidden="true">
    <div class="sheet-panel detail-sheet-panel" id="detailSheetPanel" role="dialog" aria-modal="true" aria-labelledby="dsTitle">
      <div class="ds-accent-bar" id="dsAccentBar"></div>
      <div class="sheet-handle-area" data-sheet-close="detailSheet"><span class="sheet-handle"></span></div>
      <div class="sheet-head ds-head">
        <div class="ds-head-left" id="dsHeadMeta"></div>
        <button type="button" class="icon-btn sheet-close-btn" data-sheet-close="detailSheet" aria-label="关闭详情">✕</button>
      </div>
      <div class="sheet-body" id="dsBody"></div>
      <div class="sheet-foot" id="dsFoot"></div>
    </div>
  </div>

  <!-- 静音报名提醒弹窗 -->
  <div id="remindModal" class="rm-backdrop hidden">
    <div class="rm-dialog" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
      <div class="rm-head">
        <h3 id="rmTitle">静音报名提醒（不响铃）</h3>
        <button type="button" id="rmClose" class="icon-btn" style="width:30px;height:30px;">✕</button>
      </div>
      <div id="rmActName" class="rm-act-name"></div>
      <div class="rm-note">仅通过<strong>简短消息 + 轻微振动</strong>提醒，绝不响铃，上课时可安心使用。</div>

      <div id="rmQuickWrap" class="rm-quick-group"></div>

      <div class="rm-field">
        <label for="rmCustomTime">自定义提醒时间</label>
        <input type="datetime-local" id="rmCustomTime" class="input" />
      </div>

      <div class="rm-actions">
        <button type="button" id="rmIcsBtn" class="btn btn-sm" title="写入手机系统日历（无声弹窗，关网页/锁屏也准时生效）">📅 导入手机日历(关网页也生效)</button>
        <button type="button" id="rmCancelExisting" class="btn btn-sm btn-danger hidden">取消提醒</button>
        <button type="button" id="rmSaveBtn" class="btn btn-sm btn-primary">开启静音振动提醒</button>
      </div>
    </div>
  </div>

  <!-- 分享海报图预览弹窗 -->
  <div id="posterModal" class="rm-backdrop poster-backdrop hidden">
    <div class="rm-dialog poster-dialog" role="dialog" aria-modal="true" aria-labelledby="posterTitle">
      <div class="rm-head">
        <h3 id="posterTitle">活动分享卡片图</h3>
        <button type="button" id="posterClose" class="icon-btn" style="width:30px;height:30px;">✕</button>
      </div>
      <div class="poster-stage">
        <img id="posterPreviewImg" class="poster-img" alt="活动分享海报" />
      </div>
      <div class="poster-tip">手机可<strong>长按图片</strong>直接保存或转发微信群</div>
      <div class="poster-actions">
        <button type="button" id="posterCopyBtn" class="sheet-btn sheet-btn-secondary">🔗 复制推文链接</button>
        <button type="button" id="posterDownloadBtn" class="sheet-btn sheet-btn-primary">⬇ 保存海报图</button>
      </div>
    </div>
  </div>

  <button class="back-top" id="backTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script src="./app.js"></script>
</body>
</html>
